[project]
name = "bird-listener"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "birdnet-analyzer>=2.4",
    "sounddevice>=0.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
legacy = ["birdnetlib>=0.18", "librosa>=0.10", "tensorflow>=2.16"]
# waveshare_epd is not on PyPI — install from the local e-Paper repo:
#   pip install ./e-Paper/RaspberryPi_JetsonNano/python/lib/
# lgpio is a system package (sudo apt install python3-lgpio) — symlink into venv.
pi = ["spidev>=3.0", "gpiozero>=2.0", "lgpio>=0.2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
